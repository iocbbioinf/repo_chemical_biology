        dict(
            name="owner",
            title=_("Community owner"),
            description=_("Can manage community."),
            is_owner=True,
            can_manage=True,
            can_manage_roles=["owner", "curator", "member", "submitter"],
        ),
        dict(
            name="curator",
            title=_("Curator"),
            description=_("Can curate records."),
            can_manage=True,
            can_manage_roles=["member", "submitter"],
        ),
        dict(
            name="submitter",
            title=_("Submitter"),
            description=_("Can submit records to the community."),
            can_manage=True,
            can_manage_roles=[],
        ),
        dict(
            name="member",
            title=_("Member"),
            description=_("Community member with read permissions."),
        ),
    ]
)

