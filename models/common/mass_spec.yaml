# Mass spectrometry metadata shared by all mass spectra models
# (proteomics_dataset, metabolomics_dataset). Referenced from the models'
# metadata.yaml as `type: MassSpecCommon`.
MassSpecCommon:
  type: object
  label:
    en: Mass spectrometry
    cs: Hmotnostní spektrometrie
  properties:
    instrument_vendor:
      type: keyword
      required: true
      enum: [thermo, bruker, sciex, waters, agilent, shimadzu, other]
      label:
        en: Instrument vendor
        cs: Výrobce přístroje

    instrument_model:
      type: fulltext+keyword
      required: true
      label:
        en: Instrument model
        cs: Model přístroje
      hint:
        en: For example "Orbitrap Exploris 480" or "timsTOF Pro 2".
        cs: Například „Orbitrap Exploris 480“ nebo „timsTOF Pro 2“.

    ionization_source:
      type: keyword
      required: true
      enum: [esi, nano_esi, apci, appi, maldi, ei, ci]
      label:
        en: Ionization source
        cs: Iontový zdroj

    polarity:
      type: keyword
      required: true
      enum: [positive, negative, switching]
      label:
        en: Polarity
        cs: Polarita

    mass_analyzers:
      type: array
      label:
        en: Mass analyzers
        cs: Hmotnostní analyzátory
      help:
        en: List all analyzers of a hybrid instrument, e.g. quadrupole and orbitrap.
        cs: U hybridních přístrojů uveďte všechny analyzátory, např. kvadrupól a orbitrap.
      items:
        type: keyword
        enum: [quadrupole, ion_trap, orbitrap, tof, fticr, ion_mobility, magnetic_sector]

    mz_range:
      type: object
      label:
        en: m/z range
        cs: Rozsah m/z
      properties:
        min:
          type: double
          label:
            en: Minimum m/z
            cs: Minimální m/z
        max:
          type: double
          label:
            en: Maximum m/z
            cs: Maximální m/z
