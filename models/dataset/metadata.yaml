# Definition of metadata for dataset. Please do not add ccmm model here,
# add the ccmm_preset instead.
#
# Fields taken from the ccmm preset (not defined here): title, description,
# subjects (keywords), locations (geolocation), publication_date, resource_type.
# Record id and creation date are invenio system fields (id, created).
Metadata:
  properties:
    title:
      type: fulltext+keyword
    languages:
      type: array
      items:
        type: vocabulary
        vocabulary-type: languages

    domain_type:
      type: keyword
      required: true
      enum: [proteomics, metabolomics, lipidomics, other]
      label:
        en: Dataset domain type

    sample_type:
      type: fulltext+keyword
      label:
        en: Type of sample
      hint:
        en: For example "cell culture", "plasma" or "leaf extract".

    tissue_type:
      type: fulltext+keyword
      label:
        en: Type of tissue

    analysis_type:
      type: keyword
      required: true
      enum: [general, microbiology, plant_biology, clinical]
      label:
        en: Type of analysis

    # filled only when analysis_type is microbiology
    microbiology:
      type: MicrobiologyMetadata

    # filled only when analysis_type is plant_biology
    plant_biology:
      type: PlantBiologyMetadata

    post_translational_modifications:
      type: array
      label:
        en: Post-translational modifications
      hint:
        en: For example "Phosphorylation" or "Acetylation".
      items:
        type: fulltext+keyword

    principal_investigator:
      type: ContactPerson
      required: true
      label:
        en: Principal investigator

    sample_prepared_by:
      type: ContactPerson
      label:
        en: Sample prepared by

MicrobiologyMetadata:
  type: object
  label:
    en: Microbiology
  properties:
    species_name:
      type: fulltext+keyword
      label:
        en: Species name
      hint:
        en: Scientific name, e.g. "Escherichia coli".

    cultivation_conditions:
      type: fulltext
      label:
        en: Cultivation conditions

    extraction_protocol:
      type: fulltext
      label:
        en: Extraction protocol

PlantBiologyMetadata:
  type: object
  label:
    en: Plant biology
  properties:
    species_name:
      type: fulltext+keyword
      label:
        en: Species name
      hint:
        en: Scientific name, e.g. "Arabidopsis thaliana".

    tissue:
      type: fulltext+keyword
      label:
        en: Tissue

    collection_protocol:
      type: fulltext
      label:
        en: Collection protocol

    extraction_protocol:
      type: fulltext
      label:
        en: Extraction protocol

ContactPerson:
  type: object
  properties:
    name:
      type: fulltext+keyword
      required: true
      label:
        en: Name

    email:
      type: keyword
      required: true
      pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
      label:
        en: E-mail

    institution:
      type: fulltext+keyword
      label:
        en: Institution

    country:
      type: fulltext+keyword
      label:
        en: Country
