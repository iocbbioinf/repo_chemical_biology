# Definition of metadata for dataset. Please do not add ccmm model here,
# add the ccmm_preset instead.
#
# Fields taken from the ccmm preset (not defined here): title, description,
# subjects (keywords), locations (geolocation), publication_date, resource_type.
# Record id and creation date are invenio system fields (id, created).
Metadata:
  properties:
    title:
      type: fulltext+keyword
    languages:
      type: array
      items:
        type: vocabulary
        vocabulary-type: languages

    domain_type:
      type: keyword
      required: true
      enum: [proteomics, metabolomics, lipidomics, other]
      label:
        en: Dataset domain type
        cs: Doménový typ datové sady

    sample_type:
      type: fulltext+keyword
      label:
        en: Type of sample
        cs: Typ vzorku
      hint:
        en: For example "cell culture", "plasma" or "leaf extract".
        cs: Například „buněčná kultura“, „plazma“ nebo „extrakt z listů“.

    tissue_type:
      type: fulltext+keyword
      label:
        en: Type of tissue
        cs: Typ tkáně

    analysis_type:
      type: keyword
      required: true
      enum: [general, microbiology, plant_biology, clinical]
      label:
        en: Type of analysis
        cs: Typ analýzy

    # filled only when analysis_type is microbiology
    microbiology:
      type: MicrobiologyMetadata

    # filled only when analysis_type is plant_biology
    plant_biology:
      type: PlantBiologyMetadata

    post_translational_modifications:
      type: array
      label:
        en: Post-translational modifications
        cs: Posttranslační modifikace
      hint:
        en: For example "Phosphorylation" or "Acetylation".
        cs: Například „Fosforylace“ nebo „Acetylace“.
      items:
        type: fulltext+keyword

    principal_investigator:
      type: ContactPerson
      required: true
      label:
        en: Principal investigator
        cs: Hlavní řešitel

    sample_prepared_by:
      type: ContactPerson
      label:
        en: Sample prepared by
        cs: Vzorek připravil

MicrobiologyMetadata:
  type: object
  label:
    en: Microbiology
    cs: Mikrobiologie
  properties:
    species_name:
      type: fulltext+keyword
      label:
        en: Species name
        cs: Název druhu
      hint:
        en: Scientific name, e.g. "Escherichia coli".
        cs: Vědecký název, např. „Escherichia coli“.

    cultivation_conditions:
      type: fulltext
      label:
        en: Cultivation conditions
        cs: Podmínky kultivace

    extraction_protocol:
      type: fulltext
      label:
        en: Extraction protocol
        cs: Extrakční protokol

PlantBiologyMetadata:
  type: object
  label:
    en: Plant biology
    cs: Biologie rostlin
  properties:
    species_name:
      type: fulltext+keyword
      label:
        en: Species name
        cs: Název druhu
      hint:
        en: Scientific name, e.g. "Arabidopsis thaliana".
        cs: Vědecký název, např. „Arabidopsis thaliana“.

    tissue:
      type: fulltext+keyword
      label:
        en: Tissue
        cs: Tkáň

    collection_protocol:
      type: fulltext
      label:
        en: Collection protocol
        cs: Protokol sběru

    extraction_protocol:
      type: fulltext
      label:
        en: Extraction protocol
        cs: Extrakční protokol

ContactPerson:
  type: object
  properties:
    name:
      type: fulltext+keyword
      required: true
      label:
        en: Name
        cs: Jméno

    email:
      type: keyword
      required: true
      pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
      label:
        en: E-mail
        cs: E-mail

    institution:
      type: fulltext+keyword
      label:
        en: Institution
        cs: Instituce

    country:
      type: fulltext+keyword
      label:
        en: Country
        cs: Země
