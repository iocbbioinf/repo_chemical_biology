# Definition of metadata for dataset. Please do not add ccmm model here,
# add the ccmm_preset instead.
#
# Fields taken from the ccmm preset (not defined here): title, description,
# subjects (keywords), locations (geolocation), publication_date,
# resource_type (COAR resource types) and contributors. The principal
# investigator is a contributor with role ProjectLeader, the person who
# prepared the sample a contributor with role DataCollector; their
# institution and country come from the ROR affiliation.
# Record id and creation date are invenio system fields (id, created).
#
# Vocabularies edamtopics, ncbitaxon and unimod are generated from the
# ontologies by scripts/build_ontology_fixtures.py. Values outside these
# vocabularies are accepted: they are stored without an id, only with
# a title ({"title": {"en": "..."}}), and are not checked against the vocabulary.
Metadata:
  properties:
    title:
      type: fulltext+keyword
    languages:
      type: array
      items:
        type: vocabulary
        vocabulary-type: languages

    # Geolocations (CCMM metadata.locations) validated with RDM's location schema.
    # The preset declares geometry as a dynamic object whose schema drops the
    # GeoJSON geometry from API responses (it is stored, but never returned, so
    # editing a record erased it) and does not validate it.
    locations:
      type: RDMLocations
      marshmallow_schema_class: models.dataset.schemas.DatasetFeatureSchema

    domain_type:
      type: vocabulary
      vocabulary-type: edamtopics
      required: true
      label:
        en: Dataset domain type
      hint:
        en: EDAM topic, e.g. Proteomics or Metabolomics. Other values can be typed in.

    sample_type:
      type: fulltext+keyword
      label:
        en: Type of sample
      hint:
        en: For example "cell culture", "plasma" or "leaf extract".

    tissue_type:
      type: fulltext+keyword
      label:
        en: Type of tissue

    analysis_type:
      type: keyword
      required: true
      enum: [general, microbiology, plant_biology, clinical]
      label:
        en: Type of analysis

    # filled only when analysis_type is microbiology
    microbiology:
      type: MicrobiologyMetadata

    # filled only when analysis_type is plant_biology
    plant_biology:
      type: PlantBiologyMetadata

    post_translational_modifications:
      type: array
      label:
        en: Post-translational modifications
      hint:
        en: UNIMOD modifications, e.g. Phosphorylation or Acetylation. Other values can be typed in.
      items:
        type: vocabulary
        vocabulary-type: unimod

    # e-mails are not part of CCMM/RDM contributors, so they are kept here
    principal_investigator_email:
      type: keyword
      required: true
      pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
      label:
        en: Principal investigator e-mail
      hint:
        en: Add the principal investigator to Contributors with the role Project Leader.

    sample_preparer_email:
      type: keyword
      pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
      label:
        en: Sample preparer e-mail
      hint:
        en: Add the person who prepared the sample to Contributors with the role Data Collector.

MicrobiologyMetadata:
  type: object
  label:
    en: Microbiology
  properties:
    species:
      type: vocabulary
      vocabulary-type: ncbitaxon
      label:
        en: Species name
      hint:
        en: NCBI Taxonomy, e.g. Escherichia coli. Other species can be typed in.

    cultivation_conditions:
      type: fulltext
      label:
        en: Cultivation conditions

    extraction_protocol:
      type: fulltext
      label:
        en: Extraction protocol

PlantBiologyMetadata:
  type: object
  label:
    en: Plant biology
  properties:
    species:
      type: vocabulary
      vocabulary-type: ncbitaxon
      label:
        en: Species name
      hint:
        en: NCBI Taxonomy, e.g. Arabidopsis thaliana. Other species can be typed in.

    tissue:
      type: fulltext+keyword
      label:
        en: Tissue

    collection_protocol:
      type: fulltext
      label:
        en: Collection protocol

    extraction_protocol:
      type: fulltext
      label:
        en: Extraction protocol
